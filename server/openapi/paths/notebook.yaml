list:
  get:
    summary: List notebook notes
    description: List notebook notes with pagination and optional filters.
    tags:
      - Notebook
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: query
        name: search
        schema:
          type: string
        description: |
          Matched against title and description with `LIKE`.
          `%` and `_` in the term are treated as literals.
      - in: query
        name: status
        schema:
          type: string
          enum:
            - all
            - pending
            - completed
          default: all
      - in: query
        name: category
        schema:
          type: string
        description: Exact category match. The literal value `all` disables filtering.
    responses:
      '200':
        description: Notebook note list retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: 获取成功
                data:
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/NotebookNote'
                    total:
                      type: integer
                    page:
                      type: integer
                    limit:
                      type: integer
  post:
    summary: Create notebook note
    description: Create a notebook note.
    tags:
      - Notebook
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - title
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 300
              description:
                type: string
                maxLength: 2000
                nullable: true
              category:
                type: string
                maxLength: 50
                nullable: true
              priority:
                type: string
                enum:
                  - low
                  - medium
                  - high
              completed:
                type: boolean
    responses:
      '201':
        description: Notebook note created.
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  example: 201
                message:
                  type: string
                  example: 创建成功
                data:
                  $ref: '#/components/schemas/NotebookNote'

byId:
  get:
    summary: Get notebook note
    description: Return one notebook note by id.
    tags:
      - Notebook
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Notebook note retrieved.
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: 获取成功
                data:
                  $ref: '#/components/schemas/NotebookNote'
      '404':
        description: Notebook note not found
  put:
    summary: Update notebook note
    description: Partially update one notebook note by id. Returns 404 when the note does not exist.
    tags:
      - Notebook
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 300
              description:
                type: string
                maxLength: 2000
                nullable: true
              category:
                type: string
                maxLength: 50
                nullable: true
              priority:
                type: string
                enum:
                  - low
                  - medium
                  - high
              completed:
                type: boolean
    responses:
      '200':
        description: Notebook note updated.
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: 更新成功
                data:
                  $ref: '#/components/schemas/NotebookNote'
      '404':
        description: Notebook note not found
  delete:
    summary: Delete notebook note
    description: Delete one notebook note by id. Idempotent.
    tags:
      - Notebook
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Notebook note deleted.
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: 删除成功

components:
  schemas:
    NotebookNote:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        priority:
          type: string
          enum:
            - low
            - medium
            - high
        completed:
          type: integer
          enum:
            - 0
            - 1
          description: Stored as SQLite boolean flag; clients normalize it to boolean.
        created_at:
          type: string
          format: date-time
          description: |
            SQLite CURRENT_TIMESTAMP in UTC. Serialized without an explicit
            timezone offset (`YYYY-MM-DD HH:MM:SS`); clients must interpret it as UTC.
        updated_at:
          type: string
          format: date-time
          description: Same format and semantics as created_at.
