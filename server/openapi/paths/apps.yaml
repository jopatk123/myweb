# 应用模块 API 路径定义
#
# 所有路由均挂在 /api/apps 下，并需通过 requireAppAuth 中间件鉴权。
# 请求体字段使用 camelCase（服务端 case-helper 中间件归一化）。

list:
  get:
    summary: List apps
    description: Return installed apps. When pagination parameters are supplied, the response is a paginated object.
    tags:
      - Apps
    parameters:
      - in: query
        name: groupId
        schema:
          type: integer
      - in: query
        name: visible
        schema:
          type: boolean
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: limit
        schema:
          type: integer
    responses:
      '200':
        description: OK
  post:
    summary: Create app
    description: |
      Create a new app.
      slug 由服务端根据 name 自动生成（若发生冲突会追加 -2/-3... 后缀），
      客户端即便传 slug 也会被丢弃。
    tags:
      - Apps
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/app.yaml#/AppCreate'
    responses:
      '201':
        description: Created

byId:
  get:
    summary: Get app by id
    description: Return one app by numeric id.
    tags:
      - Apps
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: OK
      '404':
        description: App not found
  put:
    summary: Update app
    description: |
      Update an app by numeric id.
      内置应用（is_builtin=true）禁止编辑，控制器会返回 403。
      is_builtin 字段不可通过 API 修改。
    tags:
      - Apps
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/app.yaml#/AppUpdate'
    responses:
      '200':
        description: OK
      '403':
        description: Built-in apps cannot be edited
      '404':
        description: App not found
  delete:
    summary: Delete app
    description: |
      Delete an app by numeric id（硬删除）。
      若被删除应用的图标没有被其它应用引用，会同步清理图标文件。
      内置应用禁止删除。
    tags:
      - Apps
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Deleted

visibleById:
  put:
    summary: Set app visibility
    description: Update the visible state for one app.
    tags:
      - Apps
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/app.yaml#/AppSetVisible'
    responses:
      '200':
        description: Updated
      '404':
        description: App not found

autostartById:
  put:
    summary: Set app autostart
    description: |
      Update the autostart state for one app by numeric id or slug.
      路径参数 id 既可以是数字（按主键查询），也可以是 slug 字符串。
    tags:
      - Apps
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          description: 数字 id 或 slug
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/app.yaml#/AppSetAutostart'
    responses:
      '200':
        description: Updated
      '404':
        description: App not found

bulkVisible:
  put:
    summary: Update visibility for multiple apps
    description: |
      Set the visible state for multiple apps in one request.
      响应 data 字段返回 { updated: N }，表示实际被更新的应用数
      （不存在的应用 id 不会计入）。
    tags:
      - Apps
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/app.yaml#/AppBulkVisible'
    responses:
      '200':
        description: Updated

move:
  put:
    summary: Move apps to a group
    description: |
      Move multiple apps to a target group.
      targetGroupId 为 null 表示移动到无分组；若提供则必须为已存在且未删除的分组 id。
      响应 data 字段返回 { moved: N }，表示实际被移动的应用数。
    tags:
      - Apps
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/app.yaml#/AppMove'
    responses:
      '200':
        description: Updated
      '404':
        description: Target group not found

iconUpload:
  post:
    summary: Upload custom app icon
    description: |
      Upload one custom icon file for app creation or editing.
      仅支持 JPEG / PNG / GIF / WebP / BMP / TIFF / AVIF / ICO，
      通过 MIME 过滤 + 魔数双重校验；不支持 SVG（SVG 无可靠的 magic bytes）。
      大小受 APP_ICON_MAX_UPLOAD_SIZE 限制（默认 5MB）。
    tags:
      - Apps
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
            required:
              - file
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
      '400':
        description: Invalid file type or size exceeded

groupsAll:
  get:
    summary: List app groups
    description: Return all app groups (excluding soft-deleted).
    tags:
      - Apps
    responses:
      '200':
        description: OK

groups:
  post:
    summary: Create app group
    description: |
      Create a new app group.
      不允许调用方设置 isDefault（API schema 已剔除该字段），
      默认分组由服务端维护唯一性。
    tags:
      - Apps
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/app.yaml#/AppGroupCreate'
    responses:
      '201':
        description: Created

groupById:
  put:
    summary: Update app group
    description: |
      Update an app group by id.
      不允许通过 API 修改 isDefault。
    tags:
      - Apps
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/app.yaml#/AppGroupUpdate'
    responses:
      '200':
        description: Updated
  delete:
    summary: Delete app group
    description: |
      Delete an app group by id（软删除）。
      默认分组（is_default=1）不可删除，会返回 400。
      删除分组前会把其下未软删的应用移动到默认分组（事务保证原子性）。
    tags:
      - Apps
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Deleted
      '400':
        description: Default group cannot be deleted
